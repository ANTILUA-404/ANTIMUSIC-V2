name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Validate commands & syntax
        run: node scripts/check.js --skip-binaries

      - name: Smoke test entrypoint (dry run)
        run: node index.js --dry-run
