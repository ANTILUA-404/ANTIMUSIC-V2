name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: |
          for file in index.js start.js src/*.js src/lavalink/*.js src/music/*.js scripts/*.js; do
            node --check "$file"
          done
