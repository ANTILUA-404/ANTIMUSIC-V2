services:
  antimusic:
    build: .
    container_name: antimusic
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # health endpoint (HEALTH_PORT di .env). Aman dihapus kalau tidak dipakai.
      - "3000:3000"
    volumes:
      # simpan whitelist, sesi radio 24/7, dan station custom
      - ./data:/app/data
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
